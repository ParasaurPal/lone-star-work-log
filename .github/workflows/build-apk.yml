name: Validate and build Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install locked dependencies
        run: npm ci

      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const audit = JSON.parse(require("node:fs").readFileSync("npm-audit.json", "utf8")); console.log("Audit summary:", JSON.stringify(audit.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) console.log(name + ": " + item.severity + " | fix=" + JSON.stringify(item.fixAvailable));'

      - name: Fail on dependency vulnerabilities
        run: npm audit --audit-level=low

      - name: Lint application
        run: npm run lint

      - name: Run core tests
        run: npm test

      - name: Build Vite application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lonestar-worklog-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
