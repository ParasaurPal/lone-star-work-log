name: Repair npm security updates

on:
  push:
    branches: [fix/comprehensive-app-stability]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update vulnerable Zod patch line
        run: npm install --package-lock-only --ignore-scripts zod@^4.6.7

      - name: Remove unused vulnerable rich-text editor
        run: npm uninstall react-quill-new

      - name: Install locked dependencies
        run: npm ci

      - name: Apply compatible security fixes
        run: npm audit fix || true

      - name: Report remaining advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const audit = JSON.parse(require("node:fs").readFileSync("npm-audit.json", "utf8")); console.log("Remaining audit summary:", JSON.stringify(audit.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) console.log(name + ": " + item.severity + " | fix=" + JSON.stringify(item.fixAvailable));'

      - name: Commit lockfile security updates
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix: update vulnerable npm dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No compatible dependency updates were required."
          fi
